<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-sm-4 mx-auto border">
            <form action="">
                <div class="mb-2">
                    <label for="names" class="form-label text-secondary">Full names</label>
                    <input type="text" class="form-control " id="names">
                    <!--                    rounded-0 makes the input vertices to be 90 degrees-->
                </div>
                <div class="mb-2">
                    <label for="email" class="form-label text-secondary">Email</label>
                    <input type="email" class="form-control " id="email">
                    <!--                    rounded-0 makes the input vertices to be 90 degrees-->
                </div>
                <div class="mb-2">
                    <label for="Password" class="form-label text-secondary">password</label>
                    <input type="password" class="form-control " id="Password" minlength="8" maxlength="12" required>
                    <!--                    rounded-0 makes the input vertices to be 90 degrees-->
                </div>
                <div class="mb-2">
                    <label for="date" class="form-label text-secondary">Date</label>
                    <input type="date" class="form-control " id="date" required>
                </div>
                <div class="mb-2">
                    <label for="phone-number" class="form-label text-secondary">Phone-number</label>
                    <input type="tel" class="form-control " id="phone-number" required>
                </div>
                <div class="mb-2">
                    <label for="edu" class="form-label text-secondary">Education</label>
                    <select name="edu" id="edu" class="form-select">
                        <option value="">University</option>
                        <option value="">College</option>
                        <option value="">Polytechnic</option>
                        <option value="">Highschool</option>
                    </select>
                </div>
                <p class="text-secondary mt-2 mb-0">Please select your gender</p>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="radio1" name="gender" value="option1" checked>Male
                    <label class="form-check-label" for="radio1"></label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="radio2" name="gender" value="option2">Female
                    <label class="form-check-label" for="radio2"></label>
                </div>

                <p class="text-secondary mt-2 mb-0">Select your favourite sports</p>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="radio1" name="optradio" value="option1">football
                    <label class="form-check-label" for="radio1"></label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="radio2" name="optradio" value="option2">basketball
                    <label class="form-check-label" for="radio2"></label>
                </div>
                <div class="reset">
                    <button class="btn btn-secondary w-100 rounded-0 my-2">Reset</button>
                </div>

                <div class="submit">
                    <button class="btn btn-secondary w-100 rounded-0 my-2">submit</button>


            </form>


        </div>

    </div>
</div>
</div>


</body>
</html>
